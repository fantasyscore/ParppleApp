apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
project.ext.react = [
    enableHermes: false
]
android {
    ndkVersion rootProject.ext.ndkVersion
    // ndkVersion = "27.2.12479018"
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.app.parpple"
    packagingOptions {
        // Add these lines to handle 16KB page size issue
        jniLibs {
            useLegacyPackaging = true
        }

        // Exclude problematic libraries if needed
        exclude "lib/x86_64/libandroidlame.so"
        exclude "lib/x86_64/libucrop.so"
        exclude "lib/arm64-v8a/libandroidlame.so"
        exclude "lib/**/libmodpdfium.so"
        exclude "lib/**/libmodft2.so"
        exclude "lib/**/libmodpng.so"
    }
    bundle {
        abi {
            enableSplit = true
        }
    }
    defaultConfig {
        applicationId "com.app.parpple"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 45
        versionName "1.0.2"
        missingDimensionStrategy 'react-native-capture-protection', 'base'
        missingDimensionStrategy 'store', 'play'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }


    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release.jks')
            storePassword '12345678'
            keyAlias 'key1'
            keyPassword '12345678'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.activity:activity:1.9.+")
    implementation project(':react-native-otp-verify')
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation "com.google.android.gms:play-services-auth:21.0.0"
    def billing_version = "8.1.0"
    implementation("com.android.billingclient:billing:$billing_version")

    // AWS Rekognition Face Liveness UI (Amplify UI)
    implementation "com.amplifyframework.ui:liveness:1.8.2"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.activity:activity-compose:1.8.2"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    // Temporary AWS credentials via Cognito Identity Pool (unauth/auth)
    implementation "com.amazonaws:aws-android-sdk-cognitoidentityprovider:2.77.0"
    implementation "com.amazonaws:aws-android-sdk-core:2.77.0"

    // Google Play In-App Updates
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")

    if (react.hasProperty("hermesEnabled") && hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/@revopush/react-native-code-push/android/codepush.gradle"
