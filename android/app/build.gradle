apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
project.ext.react = [
    enableHermes: false
]
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.parpple"

    defaultConfig {
        applicationId "com.parpple"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "1.0"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('keystore.jks')
            storePassword '12345678'
            keyAlias 'key0'
            keyPassword '12345678'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.activity:activity:1.9.+")
    implementation project(':react-native-otp-verify')
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation("com.google.firebase:firebase-analytics")
    implementation "com.google.android.gms:play-services-auth:21.0.0"
    def billing_version = "8.1.0"
    implementation("com.android.billingclient:billing:$billing_version")

    // AWS Rekognition Face Liveness UI (Amplify UI)
    implementation "com.amplifyframework.ui:liveness:1.8.2"
    implementation "androidx.compose.material3:material3:1.2.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // Temporary AWS credentials via Cognito Identity Pool (unauth/auth)
    implementation "com.amazonaws:aws-android-sdk-cognitoidentityprovider:2.77.0"
    implementation "com.amazonaws:aws-android-sdk-cognitoidentity:2.77.0"

    if (react.hasProperty("hermesEnabled") && hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/@revopush/react-native-code-push/android/codepush.gradle"
