buildscript {
    ext {
        kotlin_version = "1.9.22"
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 36
        // ndkVersion = "27.1.12297006"
        ndkVersion = "29.0.13113456 rc1"
        kotlinVersion = "2.0.21"
        // googlePlayServicesVersion = "21.0.1"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0")
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.0")
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.android.tools.build:gradle:8.3.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "com.google.android.gms:play-services-location:21.0.1"
            // Force a single OkHttp version to prevent runtime NoClassDefFoundError
            // caused by okhttp3.internal.Util being removed in newer OkHttp versions
            force "com.squareup.okhttp3:okhttp:4.12.0"
            force "com.squareup.okhttp3:okhttp-urlconnection:4.12.0"
            force "com.squareup.okhttp3:logging-interceptor:4.12.0"
            // Pin Billing Client to 6.x — react-native-iap calls the no-arg
            //enablePendingPurchases() /* which was removed in Billing Client 7.0+ */
            force "com.android.billingclient:billing:6.2.1"
        }
    }
}
subprojects { project ->
    afterEvaluate {
        if (project.plugins.hasPlugin("org.jetbrains.kotlin.android") ||
            project.plugins.hasPlugin("kotlin-android")) {
            project.extensions.extraProperties.set("kotlin_version", "1.9.22")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

